<script>

  const form = document.getElementById('contactForm');
  const status = document.getElementById('form-status');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    submitBtn.disabled = true;
    submitBtn.innerHTML = `Sending... <i class="fa-solid fa-spinner fa-spin"></i>`;

    try {
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      if (result.success) {
        status.classList.remove('hidden', 'text-red-600');
        status.classList.add('text-green-600');
        status.textContent = "✅ Thank you! Your enquiry has been sent successfully.";
        form.reset();
      } else {
        throw new Error(result.message || "Something went wrong");
      }
    } catch (error) {
      status.classList.remove('hidden', 'text-green-600');
      status.classList.add('text-red-600');
      status.textContent = "❌ Failed to send. Please try again or call us directly.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalText;

      setTimeout(() => {
        status.classList.add('hidden');
      }, 6000);
    }
  });


const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');

function toggleMobileMenu() {
  hamburger.classList.toggle('active');
  mobileMenu.classList.toggle('hidden');
}
hamburger.addEventListener('click', toggleMobileMenu);

function isMobileDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

async function handlePhoneCTA(phoneNumber) {
  if (isMobileDevice()) {
    window.location.href = `tel:${phoneNumber}`;
    return;
  }
  try {
    await navigator.clipboard.writeText(phoneNumber);
    showToast();
  } catch (err) {
    console.error('Clipboard copy failed:', err);
  }
}

const toast = document.getElementById('copy-toast');
function showToast() {
  toast.classList.remove('translate-y-[120%]', 'opacity-0');
  setTimeout(() => hideToast(), 2500);
}
function hideToast() {
  toast.classList.add('translate-y-[120%]', 'opacity-0');
}

let images = [];
let currentIndex = 0;

window.onload = function () {
  window.scrollTo(0, 0);
  const imgs = document.querySelectorAll("#galleryGrid img");
  images = Array.from(imgs).map(img => img.src);
};

function openLightbox(event, index) {
  event.preventDefault();
  currentIndex = index;
  const srcs = window.images && window.images.length ? window.images : images;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
  const lightbox = document.getElementById("lightbox");
  lightbox.classList.remove("hidden");
  lightbox.classList.add("flex");
}
function closeLightbox() {
  const lightbox = document.getElementById("lightbox");
  lightbox.classList.add("hidden");
  lightbox.classList.remove("flex");
}
function nextImage() {
  const srcs = window.images && window.images.length ? window.images : images;
  currentIndex = (currentIndex + 1) % srcs.length;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
}
function prevImage() {
  const srcs = window.images && window.images.length ? window.images : images;
  currentIndex = (currentIndex - 1 + srcs.length) % srcs.length;
  document.getElementById("lightbox-img").src = srcs[currentIndex];
}
document.getElementById("lightbox").addEventListener("click", function(e) {
  if (e.target.id === "lightbox") closeLightbox();
});
document.addEventListener("keydown", function(e) {
  if (document.getElementById("lightbox").classList.contains("hidden")) return;
  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
  if (e.key === "Escape") closeLightbox();
});

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    if (typeof Swiper !== "undefined") {
      new Swiper(".myTestimonialSwiper", {
        slidesPerView: 1,
        spaceBetween: 20,
        loop: true,
        navigation: { nextEl: ".next-btn", prevEl: ".prev-btn" },
        breakpoints: { 768: { slidesPerView: 2, spaceBetween: 28 } }
      });
    }
  }, 80);
});

function toggleFaq(button) {
  const content = button.nextElementSibling;
  const icon = button.querySelector('.faq-icon');
  document.querySelectorAll('.faq-content').forEach(item => {
    if (item !== content) {
      item.style.maxHeight = null;
      const otherIcon = item.previousElementSibling.querySelector('.faq-icon');
      if (otherIcon) otherIcon.textContent = '+';
    }
  });
  if (content.style.maxHeight) {
    content.style.maxHeight = null;
    icon.textContent = '+';
  } else {
    content.style.maxHeight = content.scrollHeight + "px";
    icon.textContent = '−';
  }
}
</script>
